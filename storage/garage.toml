# ============================================================
#  Garage: self-hosted, S3-compatible storage for uploaded images
#  Single node. Secrets come from the environment:
#    GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN,
#    GARAGE_DEFAULT_ACCESS_KEY / _SECRET_KEY / _BUCKET (created on start)
# ============================================================
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
