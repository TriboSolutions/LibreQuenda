# Development only, never on a server: the stack built from this checkout plus a
# test identity provider (Keycloak) standing in for Cl@ve or Chave365, over SAML 2.0
# and OpenID Connect. zitadel/test-idp/run.sh drives it.
services:
  db:
    build: db
  api:
    build: api
  proxy:
    build:
      context: .
      dockerfile: proxy/dockerfile
    ports: !reset [] # the browser runs inside the proxy's network namespace
  storage:
    build: storage
  backup:
    build: backup
  zitadel-setup:
    build: zitadel
    depends_on:
      keycloak:
        condition: service_healthy
  zitadel-setup-idp:
    build: zitadel

  # realm "clave-test": one person, 12345678z / proba-clave. Reached as keycloak:8080
  # by Zitadel and by the browser alike.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://keycloak:8080
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./zitadel/test-idp/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
