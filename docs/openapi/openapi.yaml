# LibreQuenda API: OpenAPI 3.1, written from the Go code (api/core/*/*Routes.go, handlers and DTOs).
openapi: 3.1.0
info:
  title: API de LibreQuenda
  version: 1.0.0
  summary: Reserva de instalacións deportivas municipais.
  description: |-
    A API principal de LibreQuenda, servida polo servizo en Go (api/) detrás do proxy Caddy baixo /api (Caddy quita o prefixo: /api/health/db chega ao servizo como /health/db).

    **Axentes.** `/api/mcp` é un servidor MCP (Model Context Protocol, Streamable HTTP, JSON-RPC), que non forma parte desta descrición REST: os axentes de IA consultan instalacións e reservan coas súas ferramentas, e inician a sesión da persoa co fluxo de dispositivo de OAuth. Véxase docs/mcp.md.

    **Autenticación.** As rutas con sesión iniciada levan un token de acceso de Zitadel (OIDC): `Authorization: Bearer <jwt>`. Os lectores QR usan a súa clave de dispositivo na mesma cabeceira (`readerKey`).

    **Versións.** Todas as rutas agás /health/db responden con `X-App-Version` (a versión da API). Un cliente pode enviar a súa propia `X-App-Version`; se é distinta, devólvese un 409 (errors.version_mismatch) para que recargue.

    **Corpos.** Os corpos JSON teñen un límite de 64 KB (un maior é un 400); a solicitude de veciñanza, de 4 KB; a subida de imaxes é multipart, de ata 5 MB.

    **Erros.** `{"error": "<message>"}`, traducido segundo Accept-Language (gl, es, en, ca); un corpo rexeitado pola súa validación dá `{"error": ["<message>", …]}` cun 400.

    **Límites de peticións.** Por IP de cliente e ruta: 60 de golpe e despois 10 por segundo por defecto; as rutas marcadas como estritas permiten 5 de golpe e despois unha cada 12 segundos. Se se supera, un 429.

    **CORS.** Calquera orixe; cabeceiras permitidas Authorization, Content-Type, X-App-Version. OPTIONS en calquera ruta responde 204 sen executar o manexador; algunhas rutas GET públicas tamén responden a HEAD (indícase nas súas descricións).
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
- url: http://localhost/api
  description: Desenvolvemento (a pila de compose).
- url: https://{domain}/api
  description: Unha instalación de LibreQuenda.
  variables:
    domain:
      default: reservas.concello.gal
      description: O dominio da instalación de LibreQuenda.
tags:
- name: Public
  description: 'O que pode ler calquera: concellos, instalacións, os seus días, eventos, etiquetas, imaxe.'
- name: Me
  description: 'A persoa usuaria con sesión iniciada: perfil, preferencias, «Para ti», QR persoal, exportación de datos, solicitudes de veciñanza.'
- name: Bookings
  description: As reservas propias da persoa usuaria.
- name: Invites
  description: Compartir unha reserva, reservas públicas e unirse a unha.
- name: Ratings
  description: Estrelas para as instalacións e para as outras persoas xogadoras despois dunha reserva.
- name: Calendar
  description: As reservas da persoa usuaria como fonte iCalendar á que subscribirse.
- name: Notifications
  description: A campá.
- name: Issues
  description: Problemas que a veciñanza comunica nunha instalación.
- name: Media
  description: Subidas de imaxes.
- name: Check-in
  description: 'Entrar: lectores QR na porta (clave de dispositivo) e o móbil na entrada.'
- name: Council admin
  description: A administración dun concello (as súas persoas administradoras ou a superadministración). Cada cambio queda anotado no rexistro de auditoría.
- name: Platform
  description: A superadministración da instalación de LibreQuenda. Cada cambio queda anotado no rexistro de auditoría.
- name: Health
  description: Comprobacións de funcionamento.
paths:
  /health/api:
    get:
      operationId: getApiHealth
      tags:
      - Health
      summary: A API está en funcionamento
      description: Tamén responde a HEAD. A cabeceira de resposta X-App-Version leva a versión da API.
      security: []
      responses:
        '200':
          description: A API responde (corpo baleiro).
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /health/db:
    get:
      operationId: getDatabaseHealth
      tags:
      - Health
      summary: A base de datos está accesible
      description: Tamén responde a HEAD. Fóra da comprobación de versión; límite de peticións por defecto.
      security: []
      responses:
        '200':
          description: A base de datos respondeu a un ping (corpo baleiro).
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: A base de datos non funciona.
          content:
            text/plain:
              schema:
                type: string
                const: '{"status":"db down"}'
  /tenants:
    get:
      operationId: listTenants
      tags:
      - Public
      summary: Concellos activos
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantsResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /tenants/{slug}:
    get:
      operationId: getTenant
      tags:
      - Public
      summary: Un concello activo
      security: []
      parameters:
      - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouncilPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /facilities:
    get:
      operationId: listFacilities
      tags:
      - Public
      summary: Todas as instalacións activas de todos os concellos
      description: 'Pública. Un token bearer válido é opcional: coa sesión iniciada como persoa veciña verificada, quedan fóra as instalacións só para veciños doutros concellos. Con ?lat=&lon=, as máis próximas primeiro e a distance_km de cada unha. Os filtros só de día (from, until, public) son un 400 aquí. As tarxetas e as súas quendas libres de hoxe calcúlanse unha vez para todas e gárdanse 30 segundos, así que ler a lista páxina a páxina e o mapa xunto non repite o traballo.'
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/Council'
      - $ref: '#/components/parameters/Sport'
      - $ref: '#/components/parameters/Tags'
      - name: booking
        in: query
        required: false
        description: 'Separadas por comas: só instalacións con algunha destas á que unirse (próximas, con prazas libres).'
        schema:
          type: string
          pattern: ^(public|event)(,(public|event))*$
      - $ref: '#/components/parameters/Lat'
      - $ref: '#/components/parameters/Lon'
      - $ref: '#/components/parameters/RadiusKm'
      - $ref: '#/components/parameters/MinRating'
      - name: bbox
        in: query
        required: false
        description: 'oeste,sur,leste,norte en graos: só as instalacións cun punto no mapa dentro (a vista do mapa da páxina de inicio).'
        schema:
          type: string
          example: -9.3,41.8,-6.7,43.8
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilitiesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /facilities/map:
    get:
      operationId: listFacilityPins
      tags:
      - Public
      summary: As instalacións no mapa da páxina de inicio
      description: 'Pública, cos mesmos filtros ca /facilities (bbox é un 400 aquí): todas as que teñen punto no mapa, sen paxinar, e só o que precisa o mapa. A lista ao seu carón lese páxina a páxina en /facilities.'
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/Council'
      - $ref: '#/components/parameters/Sport'
      - $ref: '#/components/parameters/Tags'
      - name: booking
        in: query
        required: false
        description: 'Separadas por comas: só instalacións con algunha destas á que unirse.'
        schema:
          type: string
          pattern: ^(public|event)(,(public|event))*$
      - $ref: '#/components/parameters/Lat'
      - $ref: '#/components/parameters/Lon'
      - $ref: '#/components/parameters/RadiusKm'
      - $ref: '#/components/parameters/MinRating'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pins:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        slug:
                          type: string
                        name:
                          type: string
                        latitude:
                          type: number
                        longitude:
                          type: number
                        free_today:
                          type: integer
                        tags:
                          type: array
                          items:
                            type: string
                        council:
                          $ref: '#/components/schemas/Tenant'
                      required: [id, slug, name, latitude, longitude, free_today, tags, council]
                required: [pins]
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /facilities/day:
    get:
      operationId: listFacilitiesDay
      tags:
      - Public
      summary: As instalacións de todos os concellos coas súas quendas nun día
      description: 'Pública. Un token bearer válido é opcional: coa sesión iniciada como persoa veciña verificada, quedan fóra as instalacións só para veciños doutros concellos; sen sesión, as reservas públicas só amosan a persoa titular (people e joined baléiranse). Con from/until só se conservan as quendas libres que comezan en [from, until), e con public=true as reservas públicas con prazas libres en vez das quendas libres; as instalacións que quedan sen nada desaparecen. booking é un 400 aquí.'
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Date'
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/Council'
      - $ref: '#/components/parameters/Sport'
      - $ref: '#/components/parameters/Tags'
      - name: from
        in: query
        required: false
        description: 'HH:MM, hora do concello: quendas que comezan a esa hora ou despois. Anterior a until.'
        schema:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
      - name: until
        in: query
        required: false
        description: 'HH:MM, hora do concello: quendas que comezan antes desa hora.'
        schema:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
      - name: public
        in: query
        required: false
        description: 'true: reservas públicas con prazas libres en vez de quendas libres.'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - $ref: '#/components/parameters/Lat'
      - $ref: '#/components/parameters/Lon'
      - $ref: '#/components/parameters/RadiusKm'
      - $ref: '#/components/parameters/MinRating'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilitiesDayResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /events:
    get:
      operationId: listUpcomingEvents
      tags:
      - Public
      summary: Os próximos eventos de todos os concellos
      description: 'Pública. Un token bearer válido é opcional: coa sesión iniciada como persoa veciña verificada, quedan fóra os eventos só para veciños doutros concellos. ?lat=&lon= dan a distancia de cada instalación.'
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Lat'
      - $ref: '#/components/parameters/Lon'
      - $ref: '#/components/parameters/RadiusKm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpcomingEventsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /tenants/{slug}/day:
    get:
      operationId: getTenantDay
      tags:
      - Public
      summary: As instalacións dun concello coas súas quendas nun día
      description: 'Pública. Un token bearer válido é opcional: sen sesión, as reservas públicas só amosan a persoa titular (people e joined baléiranse).'
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantSlug'
      - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /tenants/{slug}/facilities/{facility}:
    get:
      operationId: getFacilityPage
      tags:
      - Public
      summary: A páxina dunha instalación
      description: 'Pública. Un token bearer válido é opcional: sen sesión, as reservas públicas só amosan a persoa titular. Detalles, as quendas do día (?date=) e o seu horario semanal.'
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantSlug'
      - $ref: '#/components/parameters/FacilitySlug'
      - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /tenants/{slug}/facilities/{facility}/weather:
    get:
      operationId: getFacilityWeather
      tags:
      - Public
      summary: A predición do tempo dunha instalación para un día
      description: 'Pública. Gardada en caché 10 minutos (Cache-Control: public, max-age=600). Fonte: MeteoGalicia.'
      security: []
      parameters:
      - $ref: '#/components/parameters/TenantSlug'
      - $ref: '#/components/parameters/FacilitySlug'
      - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /tags:
    get:
      operationId: getTagCatalogue
      tags:
      - Public
      summary: O catálogo de etiquetas
      description: 'Público: úsano os filtros de todas as páxinas. Tamén responde a HEAD.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagCatalogueResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /branding:
    get:
      operationId: getBranding
      tags:
      - Public
      summary: O nome e o logotipo da instalación de LibreQuenda
      description: 'Público: amósaos todas as páxinas. Tamén responde a HEAD.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branding'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /calendar/{file}:
    get:
      operationId: getCalendarFeed
      tags:
      - Calendar
      summary: As reservas dunha persoa usuaria como fonte iCalendar
      description: 'Para aplicacións de calendario, que non poden iniciar sesión: o token no nome do ficheiro é o segredo. Cache-Control: private, no-cache; Referrer-Policy: no-referrer.'
      security: []
      parameters:
      - name: file
        in: path
        required: true
        description: <token>.ics, o token de GET /me/calendar.
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}\.ics$
      responses:
        '200':
          description: A fonte (text/calendar; charset=utf-8).
          content:
            text/calendar:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me:
    get:
      operationId: getMe
      tags:
      - Me
      summary: A persoa usuaria actual
      description: De paso, crea ou actualiza a fila da persoa usuaria a partir de Zitadel.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
    delete:
      operationId: deleteAccount
      tags:
      - Me
      summary: Borrar a conta definitivamente
      description: A web pecha a sesión despois. Auditado.
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Borrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /me/profile:
    put:
      operationId: updateProfile
      tags:
      - Me
      summary: Gardar os datos persoais
      description: Data de nacemento, teléfono e foto. A foto cópiase tamén na conta de Zitadel (na medida do posible).
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/preferences:
    put:
      operationId: updatePreferences
      tags:
      - Me
      summary: Gardar as preferencias
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/recommendations:
    put:
      operationId: setShowRecommendations
      tags:
      - Me
      summary: Amosar ou agochar «Para ti»
      description: '{"show": false} agocha «Para ti» na páxina de inicio.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShowRecommendationsInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: getRecommendations
      tags:
      - Me
      summary: '«Para ti»'
      description: 'As recomendacións da persoa veciña con sesión iniciada, calculadas ao ler a partir das súas propias reservas e das quendas libres de hoxe. Cache-Control: no-store.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: getRecommendationsNear
      tags:
      - Me
      summary: '«Para ti», preto dunha posición'
      description: 'Coma GET, con onde está a persoa no corpo (para que non quede nos rexistros): contan as reservas públicas próximas. Cache-Control: no-store.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Position'
        description: As dúas coordenadas ou ningunha ({}).
      responses:
        '200':
          description: OK
