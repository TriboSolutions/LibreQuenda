    FacilityInput:
      type: object
      description: 'Lengths in characters. schedule: create only, saved with it.'
      properties:
        show_weather:
          type: boolean
        slug:
          type: string
          description: Lower-cased; not admin, reservas, me or widget.
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          minLength: 2
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 5000
        tags:
          type: array
          items:
            type: string
            pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
            minLength: 2
            maxLength: 64
          description: Slugs from the platform's tag catalogue; duplicates dropped.
          maxItems: 40
        address:
          type: string
          maxLength: 500
        latitude:
          type:
          - number
          - 'null'
          format: double
          minimum: -90
          maximum: 90
          description: Both or neither.
        longitude:
          type:
          - number
          - 'null'
          format: double
          minimum: -180
          maximum: 180
        capacity:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 1
          maximum: 100000
        accessibility_info:
          type: string
          maxLength: 2000
        contact_phone:
          type: string
          description: 'Optional: without it, residents see the council''s.'
          pattern: ^\+?[0-9 ()-]+$
          minLength: 6
          maxLength: 50
        contact_email:
          type: string
          format: email
          maxLength: 255
        image_ref:
          type: string
          description: A storage reference from POST /media (folder facilities), never a URL.
        is_active:
          type: boolean
        slot_minutes:
          type: integer
          description: A multiple of 5.
          format: int32
          minimum: 15
          maximum: 480
          multipleOf: 5
        min_age:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 1
          maximum: 80
          description: 'Age control: null = none.'
        residents_only:
          type: boolean
          description: Only the council's verified residents book or join here.
        usage_rules:
          type: string
          maxLength: 5000
        schedule:
          $ref: '#/components/schemas/ScheduleInput'
      required:
      - slug
      - name
      - slot_minutes
