    PublicTurn:
      type: object
      description: A public booking, or one of the council's events, on the facility's day.
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - public
          - event
        title:
          type: string
          description: Events only.
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        description:
          type: string
        capacity:
          type: integer
          description: 'People in it at most: with the owner for a public booking, only who joins for an event.'
          format: int32
        people:
          type: array
          items:
            type: string
          description: 'First names: the owner first (not for an event), then who joined; signed out, only the owner.'
