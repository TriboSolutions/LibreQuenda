  /admin/email-log:
    get:
      operationId: platformGetEmailLog
      tags:
      - Platform
      summary: Os correos que LibreQuenda intentou enviar
      description: 'Só a superadministración, coa sesión iniciada cun segundo factor (cando REQUIRE_ADMIN_MFA está activado). Cada correo, enviado ou non: destinatario, asunto, tipo, concello, remitente, servidor SMTP e o erro se fallou (nunca o corpo). Os máis recentes primeiro, 50 por páxina (?before= para a seguinte); ?format=csv para o ficheiro. Un valor non válido nun filtro é coma non filtrar. Cache-Control: no-store.'
      security:
      - bearerAuth: []
      parameters:
      - name: q
        in: query
        required: false
        description: Parte do enderezo, do asunto ou do erro (sen distinguir maiúsculas).
        schema:
          type: string
          maxLength: 100
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [sent, failed]
      - name: kind
        in: query
        required: false
        description: O tipo de correo (booking_reminder, invitation, issue, notice, poll, smtp_test…); os que hai veñen en kinds.
        schema:
          type: string
          pattern: ^[a-z_]{1,64}$
      - name: council
        in: query
        required: false
        description: Só os correos deste concello (404 se non existe).
        schema:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          maxLength: 64
      - $ref: '#/components/parameters/AuditFrom'
      - $ref: '#/components/parameters/AuditTo'
      - $ref: '#/components/parameters/AuditBefore'
      - $ref: '#/components/parameters/AuditFormat'
      responses:
        '200':
          description: Unha páxina do rexistro, ou o ficheiro CSV (attachment; filename="email-log.csv").
