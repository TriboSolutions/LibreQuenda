components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Zitadel (OIDC) access token. Council admin and platform routes also check the role (and the second factor)
        in the handler.
    readerKey:
      type: http
      scheme: bearer
      description: 'A QR reader''s device key (`lqd_` + 43 characters), shown once when the council adds the reader: `Authorization:
        Bearer lqd_…`.'
  parameters:
    TenantSlug:
      name: slug
      in: path
      required: true
      description: The council's slug.
      schema:
        type: string
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        minLength: 2
        maxLength: 64
    FacilitySlug:
      name: facility
      in: path
      required: true
      description: The facility's slug within the council.
      schema:
        type: string
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        minLength: 2
        maxLength: 64
    BookingId:
      name: id
      in: path
      required: true
      description: The booking's id.
      schema:
        type: string
        format: uuid
    AdminFacilityId:
      name: id
      in: path
      required: true
      description: The facility's id.
      schema:
        type: string
        format: uuid
    AdminBookingId:
      name: bookingId
      in: path
      required: true
      description: The booking's (or event's) id.
      schema:
        type: string
        format: uuid
    InviteToken:
      name: token
      in: path
      required: true
      description: The invite link's token.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Page number, from 1. A bad value is a 400.
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Items per page. A bad value is a 400.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    Date:
      name: date
      in: query
      required: false
      description: The day, YYYY-MM-DD in the council's time zone; today by default.
      schema:
        type: string
        format: date
    Lat:
      name: lat
      in: query
      required: false
      description: 'Latitude of the person, with lon: nearest first and each facility''s distance_km.'
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
    Lon:
      name: lon
      in: query
      required: false
      description: Longitude of the person, with lat.
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
    RadiusKm:
      name: radius_km
      in: query
      required: false
      description: Only facilities within this distance (km); needs lat and lon. Facilities without a map pin drop out.
      schema:
        type: number
        format: double
        exclusiveMinimum: 0
        maximum: 500
    MinRating:
      name: min_rating
      in: query
      required: false
      description: Only facilities residents rated at least this on average (the average shown, one decimal); a facility nobody rated is left out.
      schema:
        type: number
        format: double
        minimum: 1
        maximum: 5
    Q:
      name: q
      in: query
      required: false
      description: Words, each somewhere in the facility's name, its council's name or slug, its sport or its tags; accents
        and case aside.
      schema:
        type: string
        maxLength: 100
    Council:
      name: council
      in: query
      required: false
      description: A council's slug.
      schema:
        type: string
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        maxLength: 64
    Sport:
      name: sport
      in: query
      required: false
      description: A tag slug the facility must have (its sport).
      schema:
        type: string
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        maxLength: 64
    Tags:
      name: tags
      in: query
      required: false
      description: Comma-separated tag slugs (up to 20, each up to 64 characters); the facility has them all.
      schema:
        type: string
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*(,[a-z0-9]+(-[a-z0-9]+)*){0,19}$
    AuditAction:
      name: action
      in: query
      required: false
      description: An action code (facility.updated) or its prefix (facility). Anything else is ignored.
      schema:
        type: string
        pattern: ^[a-z_.]{1,64}$
    AuditActor:
      name: actor
      in: query
      required: false
      description: 'Only this user''s actions. Not a UUID: ignored.'
      schema:
        type: string
        format: uuid
    AuditFrom:
      name: from
      in: query
      required: false
      description: 'From this day (YYYY-MM-DD, the installation''s zone). Unparsable: ignored.'
      schema:
        type: string
        format: date
    AuditTo:
      name: to
      in: query
      required: false
      description: 'Up to this day, included. Unparsable: ignored.'
      schema:
        type: string
        format: date
    AuditBefore:
      name: before
      in: query
      required: false
      description: 'The previous page''s next: entries before this instant (RFC 3339).'
      schema:
        type: string
        format: date-time
    AuditFormat:
      name: format
      in: query
      required: false
      description: 'csv: every matching entry (up to 10,000) as a CSV file instead of a 50-entry JSON page.'
      schema:
        type: string
        enum:
        - csv
    IndFrom:
      name: from
      in: query
      required: false
      description: First day (YYYY-MM-DD); without it, the last `days` days up to `to`.
      schema:
        type: string
        format: date
    IndTo:
      name: to
      in: query
      required: false
      description: Last day (YYYY-MM-DD), included; today by default.
      schema:
        type: string
        format: date
    IndDays:
      name: days
      in: query
      required: false
      description: Days up to `to`, used without `from`. The period may not exceed 366 days.
      schema:
        type: integer
        minimum: 1
        maximum: 366
        default: 30
    IndFacility:
      name: facility
      in: query
      required: false
      description: Only this facility (its id); every facility of the council by default.
      schema:
        type: string
        format: uuid
    IndCompare:
      name: compare
      in: query
      required: false
      description: 'previous: the same number of days just before; year: the same dates a year earlier; none.'
      schema:
        type: string
        enum:
        - previous
        - year
        - none
        default: previous
  responses:
    BadRequest:
      description: 'Bad request: an unreadable or oversized JSON body (over 64 KB), or an invalid path or query parameter.
        A body refused by its validation lists one message per field.'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: 'No valid access token (Authorization: Bearer <Zitadel access token>).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Not allowed. For administrators without a second factor (REQUIRE_ADMIN_MFA) the header X-Mfa-Required:
        1 is set and the message is errors.mfa_required.'
      headers:
        X-Mfa-Required:
          description: 1 when the administrator must sign in with a second factor.
          schema:
            type: string
            enum:
            - '1'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict with the current state (a limit reached, a turn taken, something already done…), or the X-App-Version
        sent differs from the API's version (errors.version_mismatch).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: The body was read but a value is invalid; the message names the problem.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limited (per client IP and route). Some handlers also answer 429 with a translated message (e.g. one
        residency request a week).
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/RateLimitError'
            - $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: An upstream service failed (Zitadel, the storage, the geocoder or an SMTP relay).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: The file is larger than 5 MB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Not a JPEG, PNG or WebP image (detected from its bytes).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    BookingKind:
      type: string
      description: 'private: only the owner and who they invite; public: anyone signed in may find and join it; event: the
        council''s own activity, with no owner.'
      enum:
      - private
      - public
      - event
    BookingStatus:
      type: string
      enum:
      - confirmed
      - cancelled
    CheckinMethod:
      type: string
      description: 'How someone got in: a QR reader at the door, the QR printed on the door, the facility''s entry code, its
        NFC tag, or staff marking the entry.'
      enum:
      - reader
      - printed_qr
      - entry_code
      - nfc
      - staff
    IssueCategory:
      type: string
      enum:
      - equipment
      - lighting
      - cleaning
      - changing_rooms
      - accessibility
      - safety
      - other
    IssueStatus:
      type: string
      enum:
      - new
      - in_progress
      - solved
      - rejected
    NotificationType:
      type: string
      enum:
      - booking_confirmed
      - booking_changed
      - booking_cancelled
      - booking_cancelled_by_council
      - booking_reminder
      - booking_joined
      - council_admin_granted
      - issue_reported
      - issue_solved
      - issue_rejected
      - rating_requested
      - resident_requested
      - resident_verified
      - resident_rejected
      - resident_revoked
      - participant_removed
    TenantRole:
      type: string
      enum:
      - admin
    SlotStatus:
      type: string
      description: free; booked; closed (a closure overlaps it); past (already started); too_far (beyond the booking window);
        too_soon (starts sooner than the app may book it).
      enum:
      - free
      - booked
      - closed
      - past
      - too_far
      - too_soon
    Error:
      type: object
      description: 'Every error but a refused validation: helpers.SendI18NErrorResponse.'
      properties:
        error:
          type: string
          description: The message, translated to the request's Accept-Language (gl, es, en, ca).
      required:
      - error
    ValidationError:
      type: object
      description: 'A request body that failed its Validate(): helpers.SendValidationErrorResponse (status 400).'
      properties:
        error:
          type: array
          items:
            type: string
          description: One message per invalid field.
      required:
      - error
    RateLimitError:
      type: object
      description: Written by Penguin's rate limiter, untranslated.
      properties:
        error:
          type: string
          const: Rate limit exceeded
      required:
      - error
    Pagination:
      type: object
      description: Where a page sits in the whole list (shared.PageDto).
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total:
          type: integer
          description: Items in the whole list.
          format: int64
        has_more:
          type: boolean
          description: Another page follows.
      required:
      - page
      - page_size
      - total
      - has_more
    RatingSummary:
      type: object
      description: The average stars and how many gave them; never who.
      properties:
        average:
          type: number
          description: 1 to 5, one decimal.
          format: double
          minimum: 1
          maximum: 5
        count:
          type: integer
          format: int64
          minimum: 1
      required:
      - average
      - count
    StaffContact:
      type: object
      description: Someone to ask on site (not an account).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: string
          maxLength: 30
        place:
          type: string
          description: Where to find them, e.g. «Reception, ground floor».
          maxLength: 120
        email:
          type: string
          description: Only in the fallback (the facility's or council's contact); never sent by clients.
      required:
      - name
      - phone
      - place
    StaffContactInput:
      type: object
      description: Trimmed; other fields are ignored.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: string
          maxLength: 30
        place:
          type: string
          description: Where to find them.
          maxLength: 120
      required:
      - name
    Slot:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SlotStatus'
      required:
      - starts_at
      - ends_at
      - status
    Position:
      type: object
      description: Where the person is; both or neither.
      properties:
        latitude:
          type:
          - number
          - 'null'
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type:
          - number
          - 'null'
          format: double
          minimum: -180
          maximum: 180
    Location:
      type: object
      description: 'Where the phone is: checked, never stored.'
      properties:
        latitude:
          type:
          - number
          - 'null'
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type:
          - number
          - 'null'
          format: double
          minimum: -180
          maximum: 180
        accuracy:
          type:
          - number
          - 'null'
          description: Metres.
          format: double
    Tenant:
      type: object
      description: A council (tenant).
      properties:
        slug:
          type: string
        name:
          type: string
        logo_url:
          type: string
          description: '"" without a logo.'
        contact_email:
          type: string
          description: Where residents send accessibility feedback and complaints (RD 1112/2018).
        contact_phone:
          type: string
      required:
      - slug
      - name
      - logo_url
      - contact_email
      - contact_phone
    TenantsResponse:
      type: object
      properties:
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
      required:
      - tenants
    FacilityCard:
      type: object
      description: One facility on the home page's list and map, from any council.
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        sport:
          type: string
          description: Its sport tags' names.
        tags:
          type: array
          items:
            type: string
          description: Tag slugs.
        image_url:
          type: string
        address:
          type: string
        latitude:
          type:
          - number
          - 'null'
          format: double
          description: null without a map pin.
        longitude:
          type:
          - number
          - 'null'
          format: double
        free_today:
          type: integer
          description: Turns still free today.
        council:
          $ref: '#/components/schemas/Tenant'
        residents_only:
          type: boolean
          description: Only the council's verified residents book or join there (also its events).
        joinable:
