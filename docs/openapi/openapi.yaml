    BookingRules:
      type: object
      description: 'The booking window: the council''s, which its facilities inherit, or a facility''s own. Every field is
        checked, also when its feature is off.'
      properties:
        max_advance_hours:
          type: integer
          description: How far ahead, from now.
          format: int32
          minimum: 1
          maximum: 8760
        min_advance_minutes:
          type: integer
          description: How close to the start the app still books.
          format: int32
          minimum: 0
          maximum: 1440
        min_cancel_hours:
          type: integer
          description: Cancel or change until this long before.
          format: int32
          minimum: 0
          maximum: 720
        max_active_bookings_per_user:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
        max_bookings_per_day:
          type: integer
          description: 0 = no limit.
          format: int32
          minimum: 0
          maximum: 24
        max_turns_in_a_row:
          type: integer
          description: 0 = no limit.
          format: int32
          minimum: 0
          maximum: 24
        max_bookings_per_week:
          type: integer
          description: Per person and ISO week; 0 = no limit.
          format: int32
          minimum: 0
          maximum: 100
        max_active_bookings_council:
          type: integer
          description: 'Council only: a person''s own upcoming bookings across its facilities; 0 = no limit.'
          format: int32
          minimum: 0
          maximum: 100
        weekly_opening:
          type: boolean
          description: 'Instead of max_advance_hours: next week''s turns open all at once.'
        opens_weekday:
          type: integer
          description: ISO, 7 = Sunday.
          minimum: 1
          maximum: 7
        opens_minute:
          type: integer
          description: Minutes after local midnight.
          format: int32
          minimum: 0
          maximum: 1439
        no_show_penalty:
          type: boolean
          description: After no_show_limit no-shows in no_show_window_days, no booking for no_show_block_days.
        no_show_limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 20
        no_show_window_days:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
        no_show_block_days:
          type: integer
          format: int32
          minimum: 1
          maximum: 365
      required:
      - max_advance_hours
      - min_advance_minutes
      - min_cancel_hours
      - max_active_bookings_per_user
      - max_bookings_per_day
      - max_turns_in_a_row
      - max_bookings_per_week
      - max_active_bookings_council
      - weekly_opening
      - opens_weekday
      - opens_minute
      - no_show_penalty
      - no_show_limit
      - no_show_window_days
      - no_show_block_days
    FacilityRulesInput:
      type: object
      properties:
        custom_rules:
          type: boolean
