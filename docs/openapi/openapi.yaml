        A solicitude, cos seus datos de identidade, bórrase e a persoa recibe o aviso. Auditado.

        Administración do concello: a persoa usuaria con sesión iniciada ten que ser administradora deste concello ou superadministradora, coa sesión iniciada cun segundo factor (cando REQUIRE_ADMIN_MFA está activado).
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantSlug'
      - name: requestId
        in: path
        required: true
        description: O id da solicitude.
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Descartada.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /tenants/{slug}/admin/smtp:
    get:
      operationId: adminGetSmtp
      tags:
      - Council admin
      summary: O relé SMTP propio do concello
      description: |-
        O contrasinal nunca se devolve.

        Administración do concello: a persoa usuaria con sesión iniciada ten que ser administradora deste concello ou superadministradora, coa sesión iniciada cun segundo factor (cando REQUIRE_ADMIN_MFA está activado).
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Smtp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: adminSaveSmtp
      tags:
      - Council admin
      summary: Gardar o relé SMTP propio do concello
      description: |-
        Auditado.

        Administración do concello: a persoa usuaria con sesión iniciada ten que ser administradora deste concello ou superadministradora, coa sesión iniciada cun segundo factor (cando REQUIRE_ADMIN_MFA está activado).
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmtpInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Smtp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: adminDeleteSmtp
      tags:
      - Council admin
      summary: Volver ao relé do contorno
      description: |-
        Auditado.

        Administración do concello: a persoa usuaria con sesión iniciada ten que ser administradora deste concello ou superadministradora, coa sesión iniciada cun segundo factor (cando REQUIRE_ADMIN_MFA está activado).
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantSlug'
      responses:
        '204':
          description: Borrado.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /tenants/{slug}/admin/smtp/test:
    post:
      operationId: adminTestSmtp
      tags:
      - Council admin
      summary: Enviar un correo á persoa administradora a través do relé en uso
      description: |-
        Na lingua de Accept-Language. Límite de peticións estrito: 5 de golpe e despois unha cada 12 segundos.

        Administración do concello: a persoa usuaria con sesión iniciada ten que ser administradora deste concello ou superadministradora, coa sesión iniciada cun segundo factor (cando REQUIRE_ADMIN_MFA está activado).
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmtpTest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /geocode:
    get:
      operationId: geocodeAddress
      tags:
      - Council admin
      summary: Buscar as coordenadas dun enderezo
      description: 'Para quen edita instalacións: calquera persoa administradora dun concello ou superadministradora, co segundo factor. Nominatim, unha petición por segundo para toda a API. Auditado coma todas as rutas de administración.'
      security:
      - bearerAuth: []
      parameters:
      - name: q
        in: query
        required: false
        description: O enderezo; os máis longos córtanse a 300 caracteres e con menos de 3 non hai resultados.
        schema:
          type: string
          maxLength: 300
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Un token de acceso de Zitadel (OIDC). As rutas de administración do concello e da plataforma tamén comproban o rol (e o segundo factor) no manexador.
    readerKey:
      type: http
      scheme: bearer
      description: 'A clave de dispositivo dun lector QR (`lqd_` + 43 caracteres), que se amosa unha vez cando o concello engade o lector: `Authorization: Bearer lqd_…`.'
  parameters:
    TenantSlug:
      name: slug
      in: path
      required: true
      description: O slug do concello.
      schema:
        type: string
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        minLength: 2
        maxLength: 64
    FacilitySlug:
      name: facility
      in: path
      required: true
      description: O slug da instalación dentro do concello.
      schema:
        type: string
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        minLength: 2
        maxLength: 64
    BookingId:
      name: id
      in: path
      required: true
      description: O id da reserva.
      schema:
        type: string
        format: uuid
    AdminFacilityId:
      name: id
      in: path
      required: true
      description: O id da instalación.
      schema:
        type: string
        format: uuid
    AdminBookingId:
      name: bookingId
      in: path
      required: true
      description: O id da reserva (ou do evento).
      schema:
        type: string
        format: uuid
    InviteToken:
      name: token
      in: path
      required: true
      description: O token da ligazón de invitación.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Número de páxina, desde 1. Un valor incorrecto é un 400.
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Elementos por páxina. Un valor incorrecto é un 400.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    Date:
      name: date
      in: query
      required: false
      description: O día, YYYY-MM-DD no fuso horario do concello; hoxe por defecto.
      schema:
        type: string
        format: date
    Lat:
      name: lat
      in: query
      required: false
      description: 'Latitude da persoa, con lon: as máis próximas primeiro e a distance_km de cada instalación.'
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
    Lon:
      name: lon
      in: query
      required: false
      description: Lonxitude da persoa, con lat.
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
    RadiusKm:
      name: radius_km
      in: query
      required: false
      description: Só as instalacións a esta distancia (km) como moito; precisa lat e lon. As instalacións sen punto no mapa quedan fóra.
      schema:
        type: number
        format: double
        exclusiveMinimum: 0
        maximum: 500
    MinRating:
      name: min_rating
      in: query
      required: false
      description: Só as instalacións que a veciñanza valorou polo menos con isto de media (a media amosada, cun decimal); unha instalación que ninguén valorou queda fóra.
      schema:
        type: number
        format: double
        minimum: 1
        maximum: 5
    Q:
      name: q
      in: query
      required: false
      description: Palabras, cada unha nalgún lugar do nome da instalación, do nome ou slug do seu concello, do seu deporte ou das súas etiquetas; sen ter en conta acentos nin maiúsculas.
      schema:
        type: string
        maxLength: 100
    Council:
      name: council
      in: query
      required: false
      description: O slug dun concello.
      schema:
        type: string
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        maxLength: 64
    Sport:
      name: sport
      in: query
      required: false
      description: O slug dunha etiqueta que a instalación ten que ter (o seu deporte).
      schema:
        type: string
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        maxLength: 64
    Tags:
      name: tags
      in: query
      required: false
      description: Slugs de etiquetas separados por comas (ata 20, cada un de ata 64 caracteres); a instalación ten todos.
      schema:
        type: string
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*(,[a-z0-9]+(-[a-z0-9]+)*){0,19}$
    AuditAction:
      name: action
      in: query
      required: false
      description: Un código de acción (facility.updated) ou o seu prefixo (facility). Calquera outra cousa ignórase.
      schema:
        type: string
        pattern: ^[a-z_.]{1,64}$
    AuditActor:
      name: actor
      in: query
      required: false
      description: Só as accións desta persoa usuaria. Se non é un UUID, ignórase.
      schema:
        type: string
        format: uuid
    AuditFrom:
      name: from
      in: query
      required: false
      description: Desde este día (YYYY-MM-DD, o fuso da instalación de LibreQuenda). Se non se pode interpretar, ignórase.
      schema:
        type: string
        format: date
    AuditTo:
      name: to
      in: query
      required: false
      description: Ata este día, incluído. Se non se pode interpretar, ignórase.
      schema:
        type: string
        format: date
    AuditBefore:
      name: before
      in: query
      required: false
      description: 'O next da páxina anterior: entradas anteriores a este instante (RFC 3339).'
      schema:
        type: string
        format: date-time
    AuditFormat:
      name: format
      in: query
      required: false
      description: 'csv: todas as entradas que coinciden (ata 10.000) como ficheiro CSV en vez dunha páxina JSON de 50 entradas.'
      schema:
        type: string
        enum:
        - csv
    IndFrom:
      name: from
      in: query
      required: false
      description: Primeiro día (YYYY-MM-DD); sen el, os últimos `days` días ata `to`.
      schema:
        type: string
        format: date
    IndTo:
      name: to
      in: query
      required: false
      description: Último día (YYYY-MM-DD), incluído; hoxe por defecto.
      schema:
        type: string
        format: date
    IndDays:
      name: days
      in: query
      required: false
      description: Días ata `to`, usado sen `from`. O período non pode superar os 366 días.
      schema:
        type: integer
        minimum: 1
        maximum: 366
        default: 30
    IndFacility:
      name: facility
      in: query
      required: false
      description: Só esta instalación (o seu id); por defecto, todas as instalacións do concello.
      schema:
        type: string
        format: uuid
    IndCompare:
      name: compare
      in: query
      required: false
      description: 'previous: o mesmo número de días xusto antes; year: as mesmas datas un ano antes; none.'
      schema:
        type: string
        enum:
        - previous
        - year
        - none
        default: previous
  responses:
    BadRequest:
      description: 'Petición incorrecta: un corpo JSON ilexible ou demasiado grande (máis de 64 KB), ou un parámetro de ruta ou de consulta non válido. Un corpo rexeitado pola súa validación lista unha mensaxe por campo.'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/Error'
            - $ref: '#/components/schemas/ValidationError'
    Unauthorized:
      description: 'Non hai un token de acceso válido (Authorization: Bearer <token de acceso de Zitadel>).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Non permitido. Para as persoas administradoras sen segundo factor (REQUIRE_ADMIN_MFA) ponse a cabeceira X-Mfa-Required: 1 e a mensaxe é errors.mfa_required.'
      headers:
        X-Mfa-Required:
          description: 1 cando a persoa administradora ten que iniciar sesión cun segundo factor.
          schema:
            type: string
            enum:
            - '1'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Non atopado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflito co estado actual (un límite alcanzado, unha quenda collida, algo xa feito…), ou a X-App-Version enviada difire da versión da API (errors.version_mismatch).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: O corpo leuse pero un valor non é válido; a mensaxe indica o problema.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Límite de peticións superado (por IP de cliente e ruta). Algúns manexadores tamén responden 429 cunha mensaxe traducida (p. ex., unha solicitude de veciñanza por semana).
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/RateLimitError'
            - $ref: '#/components/schemas/Error'
    InternalError:
      description: Erro inesperado do servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: Fallou un servizo externo (Zitadel, o almacenamento, o xeocodificador ou un relé SMTP).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: O ficheiro ocupa máis de 5 MB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Non é unha imaxe JPEG, PNG nin WebP (detectado polos seus bytes).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    BookingKind:
      type: string
      description: 'private: só a persoa titular e quen ela invite; public: calquera persoa con sesión iniciada pode atopala e unirse; event: a actividade propia do concello, sen titular.'
      enum:
      - private
      - public
      - event
    BookingStatus:
      type: string
      enum:
      - confirmed
      - cancelled
    CheckinMethod:
      type: string
      description: 'Como entrou alguén: un lector QR na porta, o QR impreso na porta, o código de entrada da instalación, a súa etiqueta NFC ou o persoal marcando a entrada.'
      enum:
      - reader
      - printed_qr
      - entry_code
      - nfc
      - staff
    IssueCategory:
      type: string
      enum:
      - equipment
      - lighting
      - cleaning
      - changing_rooms
      - accessibility
      - safety
      - other
    IssueStatus:
      type: string
      enum:
      - new
      - in_progress
      - solved
      - rejected
    NotificationType:
      type: string
      enum:
      - booking_confirmed
      - booking_changed
      - booking_cancelled
      - booking_cancelled_by_council
      - booking_reminder
      - booking_joined
      - council_admin_granted
      - issue_reported
      - issue_solved
      - issue_rejected
      - rating_requested
      - resident_requested
      - resident_verified
      - resident_rejected
      - resident_revoked
      - participant_removed
      - council_notice
      - poll_opened
      - poll_closed
    TenantRole:
      type: string
      enum:
      - admin
    SlotStatus:
      type: string
      description: free; booked; closed (sobreponse cun peche); past (xa comezou); too_far (fóra da ventá de reserva); too_soon (comeza antes do que a app permite reservala).
      enum:
      - free
      - booked
      - closed
      - past
      - too_far
      - too_soon
    Error:
      type: object
      description: 'Todos os erros agás unha validación rexeitada: helpers.SendI18NErrorResponse.'
      properties:
        error:
          type: string
          description: A mensaxe, traducida ao Accept-Language da petición (gl, es, en, ca).
      required:
      - error
    ValidationError:
      type: object
      description: 'Un corpo de petición que non pasou o seu Validate(): helpers.SendValidationErrorResponse (estado 400).'
      properties:
        error:
          type: array
          items:
            type: string
          description: Unha mensaxe por cada campo non válido.
      required:
      - error
    RateLimitError:
      type: object
      description: Escrito polo limitador de peticións de Penguin, sen traducir.
      properties:
        error:
          type: string
          const: Rate limit exceeded
      required:
      - error
    Pagination:
      type: object
      description: Onde está unha páxina dentro da lista enteira (shared.PageDto).
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total:
          type: integer
          description: Elementos da lista enteira.
          format: int64
        has_more:
          type: boolean
          description: Vén outra páxina despois.
      required:
      - page
      - page_size
      - total
      - has_more
    EventPeople:
      type: object
      properties:
        people:
          type: array
          items:
            $ref: '#/components/schemas/EventPerson'
      required:
      - people
    EventPerson:
      type: object
      description: Alguén nun dos eventos do concello, tal como o ve o seu persoal.
      properties:
        id:
          type: string
          format: uuid
        has_account:
          type: boolean
        name:
          type: string
          description: O nome e os apelidos da conta, ou o nome do convidado.
        email:
          type: string
          description: Baleiro para un convidado.
        age:
          type:
          - integer
          - 'null'
          description: A idade dun convidado; null para unha conta.
        rating:
          oneOf:
          - $ref: '#/components/schemas/RatingSummary'
          - type: 'null'
          description: As estrelas que lle deron as outras persoas despois de reservas públicas; null ata que alguén lle dea.
        is_resident:
          type: boolean
          description: Este concello verificouna como veciña súa.
        joined_at:
          type: string
          format: date-time
      required:
      - id
      - has_account
      - name
      - email
      - age
      - rating
      - is_resident
      - joined_at
    RatingSummary:
      type: object
      description: A media de estrelas e cantas persoas as deron; nunca quen.
      properties:
        average:
          type: number
          description: De 1 a 5, cun decimal.
          format: double
          minimum: 1
          maximum: 5
        count:
          type: integer
          format: int64
          minimum: 1
      required:
      - average
      - count
    StaffContact:
      type: object
      description: Alguén a quen preguntar no lugar (non é unha conta).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: string
          maxLength: 30
        place:
          type: string
          description: Onde atopala, p. ex. «Recepción, planta baixa».
          maxLength: 120
        email:
          type: string
          description: Só no valor por defecto (o contacto da instalación ou do concello); os clientes nunca o envían.
      required:
      - name
      - phone
      - place
    StaffContactInput:
      type: object
      description: Sen espazos nos extremos; os outros campos ignóranse.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        phone:
          type: string
          maxLength: 30
        place:
          type: string
          description: Onde atopala.
          maxLength: 120
      required:
      - name
    Slot:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SlotStatus'
      required:
      - starts_at
      - ends_at
      - status
    Position:
      type: object
      description: Onde está a persoa; as dúas ou ningunha.
      properties:
        latitude:
          type:
          - number
          - 'null'
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type:
          - number
          - 'null'
          format: double
          minimum: -180
          maximum: 180
    Location:
      type: object
      description: 'Onde está o móbil: compróbase e nunca se garda.'
      properties:
        latitude:
          type:
          - number
          - 'null'
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type:
          - number
          - 'null'
          format: double
          minimum: -180
          maximum: 180
        accuracy:
          type:
          - number
          - 'null'
          description: Metros.
          format: double
    Tenant:
      type: object
      description: Un concello (inquilino).
      properties:
        slug:
          type: string
        name:
