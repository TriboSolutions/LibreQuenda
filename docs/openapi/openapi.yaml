# LibreQuenda API: OpenAPI 3.1, written from the Go code (api/core/*/*Routes.go, handlers and DTOs).
openapi: 3.1.0
info:
  title: LibreQuenda API
  version: 1.0.0
  summary: Booking of municipal sports facilities.
  description: |-
    The LibreQuenda core API, served by the Go service (api/) behind the Caddy proxy under /api (Caddy strips the prefix: /api/health/db reaches the service as /health/db).

    **Agents.** `/api/mcp` is an MCP server (Model Context Protocol, Streamable HTTP, JSON-RPC), not part of this REST description: AI agents look up facilities and book through its tools, signing the person in with OAuth's device flow. See docs/mcp.md.

    **Authentication.** Signed-in routes take a Zitadel (OIDC) access token: `Authorization: Bearer <jwt>`. QR readers use their device key in the same header (`readerKey`).

    **Versions.** Every route but /health/db answers with `X-App-Version` (the API's version). A client may send its own `X-App-Version`; a different one is a 409 (errors.version_mismatch) so it reloads.

    **Bodies.** JSON bodies are capped at 64 KB (a larger one is a 400); the residency request at 4 KB; the image upload is multipart, up to 5 MB.

    **Errors.** `{"error": "<message>"}`, translated by Accept-Language (gl, es, en, ca); a body refused by its validation gives `{"error": ["<message>", …]}` with a 400.

    **Rate limits.** Per client IP and route: 60 at once then 10 a second by default; routes marked strict allow 5 at once, then one every 12 seconds. Over it, a 429.

    **CORS.** Any origin; allowed headers Authorization, Content-Type, X-App-Version. OPTIONS on any route answers 204 without running the handler; a few public GET routes also answer HEAD (noted in their descriptions).
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
- url: http://localhost/api
  description: Development (the compose stack).
- url: https://{domain}/api
  description: An installation.
  variables:
    domain:
      default: example.org
      description: The installation's domain.
tags:
- name: Public
  description: 'What anyone can read: councils, facilities, their days, events, tags, branding.'
- name: Me
  description: 'The signed-in user: profile, preferences, «For you», personal QR, data export, residency requests.'
- name: Bookings
  description: The user's own bookings.
- name: Invites
  description: Sharing a booking, public bookings, and joining one.
- name: Ratings
  description: Stars for facilities and other players after a booking.
- name: Calendar
  description: The user's bookings as a subscribable iCalendar feed.
- name: Notifications
  description: The bell.
- name: Issues
  description: Problems residents report at a facility.
- name: Media
  description: Image uploads.
- name: Check-in
  description: 'Getting in: QR readers at the door (device key) and the phone at the entrance.'
- name: Council admin
  description: A council's administration (its administrators, or superadministrators). Every change is recorded in the audit
    log.
- name: Platform
  description: The installation's superadministration. Every change is recorded in the audit log.
- name: Health
  description: Liveness checks.
paths:
  /health/api:
    get:
      operationId: getApiHealth
      tags:
      - Health
      summary: The API is up
      description: Also answers HEAD. The X-App-Version response header carries the API's version.
      security: []
      responses:
        '200':
          description: The API answers (empty body).
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /health/db:
    get:
      operationId: getDatabaseHealth
      tags:
      - Health
      summary: The database is reachable
      description: Also answers HEAD. Not behind the version check; default rate limit.
      security: []
      responses:
        '200':
          description: The database answered a ping (empty body).
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: The database is down.
          content:
            text/plain:
              schema:
                type: string
                const: '{"status":"db down"}'
  /tenants:
    get:
      operationId: listTenants
      tags:
      - Public
      summary: Active councils
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantsResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /tenants/{slug}:
    get:
      operationId: getTenant
      tags:
      - Public
      summary: One active council
      security: []
      parameters:
      - $ref: '#/components/parameters/TenantSlug'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /facilities:
    get:
      operationId: listFacilities
      tags:
      - Public
      summary: Every active facility of every council
      description: 'Public. A valid bearer token is optional: signed in as a verified resident, residents-only facilities
        of other councils are left out. With ?lat=&lon=, nearest first and each one''s distance_km. The day-only filters (from,
        until, public) are a 400 here.'
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/Council'
      - $ref: '#/components/parameters/Sport'
      - $ref: '#/components/parameters/Tags'
      - name: booking
        in: query
        required: false
        description: 'Comma-separated: only facilities with any of these to join (upcoming, with spots left).'
        schema:
          type: string
          pattern: ^(public|event)(,(public|event))*$
      - $ref: '#/components/parameters/Lat'
      - $ref: '#/components/parameters/Lon'
      - $ref: '#/components/parameters/RadiusKm'
      - $ref: '#/components/parameters/MinRating'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilitiesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /facilities/day:
    get:
      operationId: listFacilitiesDay
      tags:
      - Public
      summary: Every council's facilities with their turns on one day
      description: 'Public. A valid bearer token is optional: signed in as a verified resident, residents-only facilities
        of other councils are left out; signed out, public bookings show only their owner (people and joined are emptied).
        With from/until only free turns starting in [from, until) are kept, and with public=true the public bookings with
        spots left instead of free turns; facilities left with nothing drop out. booking is a 400 here.'
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Date'
      - $ref: '#/components/parameters/Q'
      - $ref: '#/components/parameters/Council'
      - $ref: '#/components/parameters/Sport'
      - $ref: '#/components/parameters/Tags'
      - name: from
        in: query
        required: false
        description: 'HH:MM, council time: turns starting at or after it. Before until.'
        schema:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
      - name: until
        in: query
        required: false
        description: 'HH:MM, council time: turns starting before it.'
        schema:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
      - name: public
        in: query
        required: false
        description: 'true: public bookings with spots left instead of free turns.'
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
      - $ref: '#/components/parameters/Lat'
      - $ref: '#/components/parameters/Lon'
      - $ref: '#/components/parameters/RadiusKm'
      - $ref: '#/components/parameters/MinRating'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilitiesDayResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /events:
    get:
      operationId: listUpcomingEvents
      tags:
      - Public
      summary: Every council's upcoming events
      description: 'Public. A valid bearer token is optional: signed in as a verified resident, residents-only events of other
        councils are left out. ?lat=&lon= give each facility''s distance.'
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Lat'
      - $ref: '#/components/parameters/Lon'
      - $ref: '#/components/parameters/RadiusKm'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpcomingEventsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /tenants/{slug}/day:
    get:
      operationId: getTenantDay
      tags:
      - Public
      summary: A council's facilities with their turns on one day
      description: 'Public. A valid bearer token is optional: signed out, public bookings show only their owner (people and
        joined are emptied).'
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantSlug'
      - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /tenants/{slug}/facilities/{facility}:
    get:
      operationId: getFacilityPage
      tags:
      - Public
      summary: One facility's page
      description: 'Public. A valid bearer token is optional: signed out, public bookings show only their owner. Details,
        the day''s slots (?date=) and its weekly schedule.'
      security:
      - {}
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantSlug'
      - $ref: '#/components/parameters/FacilitySlug'
      - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /tenants/{slug}/facilities/{facility}/weather:
    get:
      operationId: getFacilityWeather
      tags:
      - Public
      summary: A facility's weather forecast for a day
      description: 'Public. Cached for 10 minutes (Cache-Control: public, max-age=600). Source: MeteoGalicia.'
      security: []
      parameters:
      - $ref: '#/components/parameters/TenantSlug'
      - $ref: '#/components/parameters/FacilitySlug'
      - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /tags:
    get:
      operationId: getTagCatalogue
      tags:
      - Public
      summary: The tag catalogue
      description: 'Public: the filters of every page use it. Also answers HEAD.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagCatalogueResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /branding:
    get:
      operationId: getBranding
      tags:
      - Public
      summary: The installation's name and logo
      description: 'Public: every page shows them. Also answers HEAD.'
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branding'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /calendar/{file}:
    get:
      operationId: getCalendarFeed
      tags:
      - Calendar
      summary: A user's bookings as an iCalendar feed
      description: 'For calendar apps, which cannot sign in: the token in the file name is the secret. Cache-Control: private,
        no-cache; Referrer-Policy: no-referrer.'
      security: []
      parameters:
      - name: file
        in: path
        required: true
        description: <token>.ics, the token from GET /me/calendar.
        schema:
          type: string
          pattern: ^[0-9a-fA-F-]{36}\.ics$
      responses:
        '200':
          description: The feed (text/calendar; charset=utf-8).
          content:
            text/calendar:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me:
    get:
      operationId: getMe
      tags:
      - Me
      summary: The current user
      description: Creates or updates the user's row from Zitadel on the way.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
    delete:
      operationId: deleteAccount
      tags:
      - Me
      summary: Erase the account for good
      description: The web signs out afterwards. Audited.
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Erased.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /me/profile:
    put:
      operationId: updateProfile
      tags:
      - Me
      summary: Save the personal data
      description: Date of birth, phone and photo. The photo is copied to the Zitadel account too (best effort).
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/preferences:
    put:
      operationId: updatePreferences
      tags:
      - Me
      summary: Save the preferences
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/recommendations:
    put:
      operationId: setShowRecommendations
      tags:
      - Me
      summary: Show or hide «For you»
      description: '{"show": false} hides «For you» on the home page.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShowRecommendationsInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: getRecommendations
      tags:
      - Me
      summary: «For you»
      description: 'The signed-in resident''s recommendations, worked out on reading from their own bookings and today''s
        free turns. Cache-Control: no-store.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: getRecommendationsNear
      tags:
      - Me
      summary: «For you», near a position
      description: 'As GET, with where the person is in the body (so it stays out of the logs): near public bookings count.
        Cache-Control: no-store.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Position'
        description: Both coordinates, or neither ({}).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/qr:
    get:
      operationId: getPersonalQr
      tags:
      - Me
      summary: A fresh personal QR
      description: 'The web asks again every refresh_seconds; each code works once. Cache-Control: no-store.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalQr'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/qr/status:
    get:
      operationId: getPersonalQrStatus
      tags:
      - Me
      summary: Whether a reader used the personal QR
      description: 'Cache-Control: no-store.'
      security:
      - bearerAuth: []
      parameters:
      - name: code
        in: query
        required: true
        description: The QR's content, as GET /me/qr gave it; anything else is a 400.
        schema:
          type: string
          pattern: ^lq2:[0-9a-fA-F-]{36}$
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalQrStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/export:
    get:
      operationId: exportMyData
      tags:
      - Me
      summary: Download everything kept about the user
      description: 'JSON by default; ?format=csv for a spreadsheet. Sent as an attachment (librequenda-YYYY-MM-DD.json or
        .csv). Cache-Control: no-store. Audited. Strict rate limit: 5 at once, then one every 12 seconds.'
      security:
      - bearerAuth: []
      parameters:
      - name: format
        in: query
        required: false
        description: csv for a spreadsheet; JSON otherwise.
        schema:
          type: string
          enum:
          - csv
      responses:
        '200':
          description: The export.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="librequenda-YYYY-MM-DD.json" (or .csv).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /tenants/{slug}/resident-request:
    post:
      operationId: requestResidency
      tags:
      - Me
      summary: Ask a council to verify the user as its resident
      description: 'Its administrators are told and decide from their own census. One request a week across councils (429
        otherwise); 409 when already verified there or elsewhere, or a request is pending. Strict rate limit: 5 at once, then
        one every 12 seconds.'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResidentRequestInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidentRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: withdrawResidencyRequest
      tags:
      - Me
      summary: Withdraw the pending residency request
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantSlug'
      responses:
        '204':
          description: Withdrawn (it still counts for the weekly limit).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
