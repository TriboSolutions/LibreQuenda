        facility_id:
          type: string
          format: uuid
        starts_at:
          type: string
          description: Council local time, YYYY-MM-DDTHH:MM; in the future.
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}$
        ends_at:
          type: string
          description: After starts_at, at most 7 days later.
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}$
        title:
          type: string
          description: Whitespace collapsed.
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
        capacity:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 1
          maximum: 10000
          description: 'null: the facility''s.'
      required:
      - facility_id
      - starts_at
      - ends_at
      - title
    BookingInTheWay:
      type: object
      properties:
        id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        holder:
          type: string
          description: The person, or another event's title; "" once forgotten.
        is_event:
          type: boolean
      required:
      - id
      - starts_at
      - ends_at
      - holder
      - is_event
    ClosureInTheWay:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
      required:
      - starts_at
      - ends_at
      - reason
    InTheWay:
      type: object
      description: What stops an event at that time.
      properties:
        bookings:
          type: array
          items:
            $ref: '#/components/schemas/BookingInTheWay'
        closures:
          type: array
          items:
            $ref: '#/components/schemas/ClosureInTheWay'
      required:
      - bookings
      - closures
    IndicatorCounts:
      type: object
      properties:
        bookings:
          type: integer
          description: Confirmed + cancelled.
          format: int64
        confirmed:
          type: integer
          format: int64
        cancelled_by_user:
          type: integer
          format: int64
        cancelled_by_council:
          type: integer
          format: int64
        cancellation_rate:
          type:
          - number
          - 'null'
          format: double
          minimum: 0
          maximum: 1
          description: null without bookings.
        booked_hours:
          type: number
          format: double
        open_hours:
          type: number
          description: Bookable time, closures taken out.
          format: double
        occupancy:
          type:
          - number
          - 'null'
          format: double
          minimum: 0
          maximum: 1
          description: Booked ÷ open; null when never open.
        finished:
          type: integer
          description: Past confirmed bookings, at facilities with a QR reader.
          format: int64
        attended:
          type: integer
          description: Of those, checked in at the door.
          format: int64
        no_show_rate:
          type:
          - number
          - 'null'
          format: double
          minimum: 0
          maximum: 1
        ratings:
          type: integer
          format: int64
        rating_average:
          type:
          - number
          - 'null'
          format: double
          minimum: 1
          maximum: 5
          description: null without ratings.
        rating_stars:
          type: array
          items:
            type: integer
            format: int64
          description: How many gave 1, 2, 3, 4 and 5 stars.
          minItems: 5
          maxItems: 5
      required:
      - bookings
      - confirmed
      - cancelled_by_user
      - cancelled_by_council
      - cancellation_rate
      - booked_hours
      - open_hours
      - occupancy
      - finished
      - attended
      - no_show_rate
      - ratings
      - rating_average
      - rating_stars
    FacilityIndicators:
      allOf:
