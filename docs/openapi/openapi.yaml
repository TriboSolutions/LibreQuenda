          type: boolean
          description: 'false: the council''s emails use the environment''s relay.'
        unreadable:
          type: boolean
          description: 'Saved with another SECRETS_KEY: to be typed again.'
        host:
          type: string
        port:
          type: integer
          format: int32
        username:
          type: string
        has_password:
          type: boolean
        from:
          type: string
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
        env_relay:
          type: boolean
          description: The environment has a relay to fall back on.
      required:
      - configured
      - unreadable
      - host
      - port
      - username
      - has_password
      - from
      - updated_at
      - env_relay
    SmtpInput:
      type: object
      description: The council's own SMTP relay.
      properties:
        host:
          type: string
          description: 'No spaces, /, : or @.'
          minLength: 1
          maxLength: 255
          pattern: ^[^ /:@]+$
        port:
          type: integer
          description: 0 = 587.
          format: int32
          minimum: 0
          maximum: 65535
        username:
          type: string
          maxLength: 255
        password:
          type: string
          description: 'Write-only: empty keeps the saved one (while there is a username).'
          maxLength: 255
        from:
          type: string
          description: An address, e.g. «Concello de Lalín <reservas@lalin.gal>».
          maxLength: 255
      required:
      - host
      - from
    SmtpTest:
      type: object
      properties:
        to:
          type: string
        via:
          type: string
          enum:
          - council
          - environment
      required:
      - to
      - via
