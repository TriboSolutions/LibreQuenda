  /tenants/{slug}/admin/analytics/ask:
    post:
      operationId: askAnalyticsCouncil
      tags:
      - Council admin
      summary: Preguntarlles aos datos deste concello
      description: As persoas administradoras do concello, e a superadministración dentro deste concello (a analítica é sempre dun só concello). Auditado. Un modelo de linguaxe escribe SQL de só lectura sobre as vistas de analítica (sen datos persoais nin texto libre), que a base de datos limita ás filas deste concello, e responde; cada consulta que executou vén co seu resultado. 409 mentres non haxa un modelo configurado; 422 errors.ai_off_topic para unha pregunta que non trata dos datos do concello (o modelo rexéitaa coa súa ferramenta off_topic, ou a API rexeita unha resposta con código, ou unha longa que non se apoia en ningunha consulta).
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                  minLength: 1
                  maxLength: 1000
              required:
              - question
      responses:
        '200':
          description: A resposta, e cada consulta que executou co que devolveu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          description: A persoa usuaria de analítica de só lectura non está configurada (ANALYTICS_DB_PASSWORD).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
