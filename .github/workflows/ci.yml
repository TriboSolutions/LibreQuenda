# ============================================================
#  CI/CD: test the API and the web app, then build the Docker images.
#  On main and on version tags (v1.2.3) the images are published to the
#  GitHub Container Registry (ghcr.io/<owner>/librequenda-<image>).
#  No deployment: the server pulls or builds them with docker-compose.prod.yaml.
# ============================================================
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi

      # api/model is generated from db/init and db/queries: it must match them
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.30.0"
      - name: Generated code is up to date (sqlc diff)
        run: sqlc diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o /dev/null .

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json # the version in "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # as in proxy/dockerfile
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check and build
        run: pnpm build

  images:
    name: Image ${{ matrix.image }}
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publish to ghcr.io (main and tags only)
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: api
            dockerfile: api/dockerfile
          - image: db
            context: db
            dockerfile: db/dockerfile
          - image: proxy # the web build is inside it
            context: .
            dockerfile: proxy/dockerfile
          - image: storage
            context: storage
            dockerfile: storage/dockerfile
          - image: zitadel-setup
            context: zitadel
            dockerfile: zitadel/dockerfile
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main -> :main and :sha-<commit>; v1.2.3 -> :1.2.3, :1.2 and :latest
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/librequenda-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: VITE_APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
