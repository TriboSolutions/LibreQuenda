# ============================================================
#  CI/CD: test the API and the web app, scan their dependencies, then build
#  the Docker images and scan them for vulnerabilities (Trivy).
#  On main and on version tags (v1.2.3) the images are published to the
#  GitHub Container Registry (ghcr.io/<owner>/librequenda-<image>).
#  No deployment: the server pulls or builds them with docker-compose.prod.yaml.
#  The Android app is linted and built on every run (the debug APK is kept as an
#  artifact); on version tags a signed release APK goes to the GitHub release.
# ============================================================
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # weekly, so vulnerabilities published since the last push are caught too
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi

      # api/model is generated from db/init and db/queries: it must match them
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.30.0"
      - name: Generated code is up to date (sqlc diff)
        run: sqlc diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build -o /dev/null .

      # fails only on vulnerabilities the code can reach, standard library included;
      # the latest 1.27 patch, as the golang:1.27-alpine image the API is built with
      - name: Vulnerabilities (govulncheck)
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.27"
          check-latest: true
          work-dir: api
          cache-dependency-path: api/go.sum
          repo-checkout: false

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json # the version in "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # as in proxy/dockerfile
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check and build
        run: pnpm build

      # only what ships: dev dependencies never reach the browser
      - name: Vulnerabilities (pnpm audit)
        run: pnpm audit --prod --audit-level high

      # WCAG 2.1 checks (axe-core, keyboard, reflow) on every screen, the API mocked
      - name: Install Chromium for the accessibility tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Accessibility (WCAG 2.1)
        run: pnpm test:a11y

  android:
    name: Android app
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release APK on version tags
    defaults:
      run:
        working-directory: app
    env:
      # the API the app talks to: each installation builds its own app for its domain
      # (Settings -> Secrets and variables -> Actions -> Variables: ANDROID_API_BASE_URL)
      ANDROID_API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL || 'https://reservas.example.gal/api' }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      # the build runs on JDK 17 (kotlin.jvmToolchain(17)); the runner already has the Android SDK
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # caches Gradle and checks the wrapper jar is a genuine one
      - uses: gradle/actions/setup-gradle@v5

      # the app's texts and legal pages are generated from the web's locales: they must match them
      - name: Texts match the web (app/tools/web_strings.py)
        run: |
          python3 tools/web_strings.py ../web/src app/src/main/res
          if [ -n "$(git status --porcelain -- app/src/main/res app/src/main/assets)" ]; then
            git status --porcelain -- app/src/main/res app/src/main/assets
            echo "::error::Run python3 app/tools/web_strings.py web/src app/app/src/main/res and commit the result"; exit 1
          fi

      - name: Lint
        run: ./gradlew lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build (debug)
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: librequenda-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/app/build/reports/lint-results-debug.html

      # CD: v1.2.3 -> a signed release APK, versionName 1.2.3, on the GitHub release. Needs the
      # secrets ANDROID_KEYSTORE_BASE64 (base64 of the .jks), ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD; without them the step is skipped.
      - name: Build (release, signed)
        if: env.RELEASE == 'true' && env.SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          ./gradlew assembleRelease -PversionName="${GITHUB_REF_NAME#v}" -PversionCode="${GITHUB_RUN_NUMBER}"
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/librequenda-${GITHUB_REF_NAME}.apk"
          rm -f "$ANDROID_KEYSTORE_FILE"

      - name: Publish the APK on the release
        if: env.RELEASE == 'true' && env.SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/librequenda-${GITHUB_REF_NAME}.apk" --clobber

  images:
    name: Image ${{ matrix.image }}
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publish to ghcr.io (main and tags only)
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: api
            dockerfile: api/dockerfile
          - image: db
            context: db
            dockerfile: db/dockerfile
          - image: proxy # the web build is inside it
            context: .
            dockerfile: proxy/dockerfile
          - image: storage
            context: storage
            dockerfile: storage/dockerfile
          - image: zitadel-setup
            context: zitadel
            dockerfile: zitadel/dockerfile
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main -> :main and :sha-<commit>; v1.2.3 -> :1.2.3, :1.2 and :latest
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/librequenda-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # built and scanned before anything is published
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: VITE_APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          load: true
          tags: librequenda-${{ matrix.image }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # fails on HIGH or CRITICAL vulnerabilities that already have a fix, except
      # the ones accepted for a while in .trivyignore.yaml (upstream binaries)
      - name: Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned to the commit
        with:
          image-ref: librequenda-${{ matrix.image }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore.yaml

      # the same build again, from the cache
      - name: Publish
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: VITE_APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
